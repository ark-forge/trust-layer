name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Generate test signing key
        run: python3 -m trust_layer.crypto

      - name: Run tests
        run: pytest tests/ -v

      - name: Audit dependencies
        run: |
          # setuptools comes from the runner image, not from our pins: pip-audit
          # audits the environment, so a stale runner setuptools fails the job even
          # when requirements.txt already pins a fixed version.
          pip install --upgrade pip setuptools
          pip install pip-audit
          pip-audit --skip-editable
